<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Vagou - Vagas Imediatas de Beleza & Barbearia</title>
    <meta name="description" content="Aplicativo de agendamento de vagas e horários imediatos em salões de beleza, barbearias e estética." />
    
    <!-- PWA Primary Meta Tags -->
    <meta name="theme-color" content="#20C933" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vagou" />
    
    <!-- Manifest & Icons -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="Vagou - Vagas Imediatas de Beleza & Barbearia" />
    <meta property="og:description" content="Aplicativo de agendamento de vagas e horários imediatos em salões de beleza, barbearias e estética." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon.svg" />
  </head>
  <body class="bg-slate-900 sm:bg-slate-100 text-slate-900 antialiased selection:bg-emerald-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('SW registration error:', err);
          });
        });
      }
    </script>
  </body>
</html>
